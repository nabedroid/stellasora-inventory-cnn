services:
  main:
    container_name: main
    build:
      context: .
      dockerfile: ./main/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./main/package.json
        - action: rebuild
          path: ./main/Dockerfile
        - action: sync
          path: ./common
          target: /app/common
        - action: sync
          path: ./main
          target: /app/main
          ignore:
            - node_modules/
            - Dockerfile
            - package.json
            - README.md
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
  manager:
    container_name: manager
    build:
      context: .
      dockerfile: ./manager/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./manager/package.json
        - action: rebuild
          path: ./manager/Dockerfile
        - action: sync
          path: ./common
          target: /app/common
        - action: sync
          path: ./manager
          target: /app/manager
          ignore:
            - node_modules/
            - Dockerfile
            - package.json
            - README.md
    ports:
      - "3001:3001"
    stdin_open: true
    tty: true
  ml:
    container_name: ml
    build:
      context: .
      dockerfile: ./ml/Dockerfile
    volumes:
      - ./ml:/app/ml
      # export_onnx.py がアプリの読込先へ直接書き出せるようにする
      - ./common/public/models:/app/common/public/models
    working_dir: /app/ml
    stdin_open: true
    tty: true
    # 学習は GPU 前提 (NVIDIA + Docker Desktop / WSL2)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
